<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jscore</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2b4a8b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef0f3;--panel:#f7f8fa;--card:#fff;--ink:#1c2433;--mute:#667085;--line:#d5d9e0;--accent:#2b4a8b;--accent-ink:#fff;--mark:#c8372d;--hl:#ffe45c;--shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--panel:#171c25;--card:#1e2430;--ink:#e8ebf1;--mute:#98a2b3;--line:#2c3443;--accent:#7ea2f0;--accent-ink:#0d1320;--mark:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12161d;--panel:#171c25;--card:#1e2430;--ink:#e8ebf1;--mute:#98a2b3;--line:#2c3443;--accent:#7ea2f0;--accent-ink:#0d1320;--mark:#ff6b5e;--shadow:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;margin:0}
.app{display:grid;grid-template-columns:272px 1fr;gap:16px;height:100vh;height:100dvh;padding:12px 0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.brand{font-family:"Instrument Serif",serif;font-size:26px;padding:4px 6px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--mark);display:inline-block}
.tree .row{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .row:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tree .row.on{background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:500}
.tree .row.drop{outline:2px dashed var(--accent)}
.tw{width:16px;color:var(--mute);font-size:11px;text-align:center;flex:none}
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
.crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;flex:1;min-width:140px;font-family:"Instrument Serif",serif;font-size:22px}
.crumbs a{cursor:pointer;color:var(--mute)}.crumbs a:last-child{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--mark)}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;position:relative;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.card.drop{outline:2px dashed var(--accent)}
.thumb{height:120px;background:repeating-linear-gradient(0deg,transparent 0 11px,color-mix(in srgb,var(--ink) 9%,transparent) 11px 12px),var(--bg);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--mute);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cn{padding:8px 10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{padding:0 10px 8px;font:12px "IBM Plex Mono",monospace;color:var(--mute)}
.dots{position:absolute;top:6px;right:6px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.empty{padding:48px 16px;text-align:center;color:var(--mute)}
.empty h2{font-size:28px;color:var(--ink);margin-bottom:6px}
.mask{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
.dlg h3{font-size:24px;margin-bottom:10px}
.dlg input[type=text],.dlg textarea,.fld{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:8px}
.menu button:hover{background:var(--bg)}
.pick{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;padding:4px}
.pick .row{padding:7px 8px;border-radius:7px;cursor:pointer}
.pick .row.on{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.tabs{display:flex;gap:4px;padding:8px 16px 0}
.tab{border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:var(--bg);padding:7px 14px}
.tab.on{background:var(--card);font-weight:600}
.pane{padding:12px 16px 24px}
#main.focus .top,#main.focus .tabs{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.srch{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
#main.focus .pane{padding:8px 8px 12px}
.fab{position:fixed;top:10px;right:14px;z-index:30;display:flex;gap:4px;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:4px 6px;box-shadow:var(--shadow)}
.fab .btn{padding:5px 10px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);outline:1px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--accent)}
.page{position:relative;display:inline-block;max-width:100%;background:#fff;box-shadow:var(--shadow);touch-action:pan-x pan-y}
.page.draw{touch-action:none}
.page img,.page canvas.base{display:block;max-width:100%;height:auto}
.page canvas.ov{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-6px,-100%);pointer-events:none;font:600 12px "IBM Plex Sans",sans-serif;background:#ffe9a8;color:#5a3b00;border:1px solid #e0b94a;border-radius:8px 8px 8px 0;padding:2px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#pw.marking{cursor:crosshair;outline:3px dashed #e0b94a;outline-offset:-3px}
.pgs{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.mono{font-family:"IBM Plex Mono",monospace;font-size:13px}
.mute{color:var(--mute)}
#abcbox{width:100%;min-height:150px;font-family:"IBM Plex Mono",monospace;font-size:13px}
#paper{background:#fff;border-radius:10px;padding:8px;overflow:auto;color:#111}
canvas.roll{width:100%;height:150px;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:block}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.msg{padding:8px 12px;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent);margin:8px 0;font-size:14px}
.msg.err{background:color-mix(in srgb,var(--mark) 14%,transparent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:99;display:none}
#pnls{position:fixed;right:12px;bottom:12px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.pnl{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.pnl.min .pb{display:none}.pnl.min .ph{margin-bottom:0}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:8px}.ph h3{flex:1;font-size:22px}.ph .btn{padding:4px 10px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.bpm{font:500 44px/1 "IBM Plex Mono",monospace;text-align:center;flex:1;min-width:90px}
.dots2{display:flex;gap:8px;justify-content:center;margin:8px 0;min-height:18px}.dots2 i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block}.dots2 i.on{background:var(--mark);border-color:var(--mark)}.dots2 i.acc.on{background:var(--accent);border-color:var(--accent)}
.bigbtn{flex:1;justify-content:center;font-size:18px;padding:10px 12px}
.tnote{font:400 72px/1 "Instrument Serif",Georgia,serif;text-align:center}
.cents{position:relative;height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);margin:12px 0}.cents:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line)}.cents b{position:absolute;top:-4px;width:5px;height:20px;border-radius:3px;background:var(--mute);left:50%;transform:translateX(-50%);transition:left .08s}.cents b.ok{background:#1b8a4b}
.keys12{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.keys12 .btn{justify-content:center;padding:7px 0}
.mb{display:none}
.app.nosb{grid-template-columns:1fr}.app.nosb aside{display:none}.app.nosb .mb{display:inline-flex}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s;border-radius:0 14px 14px 0}
 aside.open{transform:none}
 .mb{display:inline-flex}
}
</style>
</head><body>
<div class="app">
 <aside id="side">
  <div class="brand" id="brand" role="button" title="Voltar ao início" style="cursor:pointer"><i></i>Jscore</div>
  <button class="btn" id="bHideSide" title="Ocultar este painel">◀ Ocultar</button>
  <input type="search" id="q" class="srch" placeholder="🔎 Buscar por nome ou número" autocomplete="off">
  <div style="display:flex;gap:6px"><button class="btn" id="sMet" style="flex:1;justify-content:center">🥁 Metrônomo</button><button class="btn" id="sTun" style="flex:1;justify-content:center">🎯 Afinador</button></div>
  <button class="btn pri" id="sNewFolder">＋ Nova pasta</button>
  <div class="tree" id="tree"></div>
  <div style="margin-top:auto;display:flex;gap:6px;flex-wrap:wrap">
   <button class="btn" id="bBackup">⬇ Backup</button>
   <button class="btn" id="bRestore">⬆ Restaurar</button>
  </div>
 </aside>
 <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fImport" accept=".pdf,.png,.jpg,.jpeg,.webp,.xml,.musicxml,.mid,.midi,.abc,.txt,image/*,application/pdf" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fAdd" accept="image/*,application/pdf" capture="environment" hidden>
<input type="file" id="fRestore" accept=".json,application/json" hidden>
<script>
/* ===== util + storage ===== */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
let idb=null,mem=new Map(),memMode=false;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('repertorio',1);r.onupgradeneeded=()=>r.result.createObjectStore('nodes',{keyPath:'id'});r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
function dbAll(){return new Promise(res=>{if(!idb)return res([...mem.values()]);const q=idb.transaction('nodes').objectStore('nodes').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})}
function dbPut(n){n.updated=Date.now();if(!idb){mem.set(n.id,n);return Promise.resolve()}return new Promise(res=>{try{const t=idb.transaction('nodes','readwrite');t.objectStore('nodes').put(n);t.oncomplete=()=>res();t.onerror=()=>{toast('Falha ao salvar (armazenamento cheio?)');res()}}catch(e){toast('Falha ao salvar');res()}})}
function dbDel(id){if(!idb){mem.delete(id);return Promise.resolve()}return new Promise(res=>{const t=idb.transaction('nodes','readwrite');t.objectStore('nodes').delete(id);t.oncomplete=()=>res()})}
let NODES=[];
async function reload(){NODES=await dbAll();NODES.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt',{numeric:true}))}
const kids=pid=>NODES.filter(n=>n.parentId===pid);
const byId=id=>NODES.find(n=>n.id===id);
function isDesc(id,anc){let c=byId(id);while(c){if(c.id===anc)return true;c=byId(c.parentId)}return false}
function path(id){const a=[];let c=byId(id);while(c){a.unshift(c);c=byId(c.parentId)}return a}
const ROOT=null;
let cur=ROOT,openIds=new Set(),viewing=null;

/* ===== modal helpers (sem alert/prompt) ===== */
function modal(html,setup){const m=$('#modal');m.innerHTML='<div class="mask"><div class="dlg">'+html+'</div></div>';const mk=m.firstChild;mk.addEventListener('mousedown',e=>{if(e.target===mk)closeModal()});if(setup)setup(m.firstChild.firstChild);return m}
function closeModal(){$('#modal').innerHTML=''}
function ask(title,val,okLabel){return new Promise(res=>{modal(`<h3>${esc(title)}</h3><input type="text" id="mi" value="${esc(val||'')}"><div class="acts"><button class="btn" id="mc">Cancelar</button><button class="btn pri" id="mo">${okLabel||'OK'}</button></div>`,d=>{const i=$('#mi',d);i.focus();i.select();const ok=()=>{const v=i.value.trim();closeModal();res(v||null)};$('#mo',d).onclick=ok;$('#mc',d).onclick=()=>{closeModal();res(null)};i.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape'){closeModal();res(null)}}})})}
function confirmBox(title,text,label){return new Promise(res=>{modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn" id="mc">Cancelar</button><button class="btn pri" id="mo">${label||'Confirmar'}</button></div>`,d=>{$('#mo',d).onclick=()=>{closeModal();res(true)};$('#mc',d).onclick=()=>{closeModal();res(false)}})})}
function pickFolder(title,exclude,label){return new Promise(res=>{let sel=ROOT;modal(`<h3>${esc(title)}</h3><div class="pick" id="pk"></div><div class="acts"><button class="btn" id="mc">Cancelar</button><button class="btn pri" id="mo">${label||'Escolher'}</button></div>`,d=>{const pk=$('#pk',d);const draw=()=>{let h=`<div class="row ${sel===ROOT?'on':''}" data-id="">📁 Início (raiz)</div>`;const walk=(pid,dep)=>kids(pid).filter(n=>n.type==='folder'&&!(exclude&&(n.id===exclude||isDesc(n.id,exclude)))).forEach(n=>{h+=`<div class="row ${sel===n.id?'on':''}" data-id="${n.id}" style="padding-left:${8+dep*16}px">📁 ${esc(n.name)}</div>`;walk(n.id,dep+1)});walk(ROOT,1);pk.innerHTML=h;pk.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.id||ROOT;draw()})};draw();$('#mo',d).onclick=()=>{closeModal();res({id:sel})};$('#mc',d).onclick=()=>{closeModal();res(null)}})})}
function menu(items){return new Promise(res=>{modal('<div class="menu">'+items.map((t,i)=>`<button data-i="${i}">${esc(t)}</button>`).join('')+'</div>',d=>{d.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeModal();res(+b.dataset.i)})})})}

/* ===== operações sobre nós ===== */
async function mkFolder(pid){const n=await ask('Nova pasta','', 'Criar');if(!n)return;const f={id:uid(),type:'folder',parentId:pid,name:n,created:Date.now()};await dbPut(f);if(pid)openIds.add(pid);await reload();render()}
async function renameNode(n){const v=await ask('Renomear',n.name,'Salvar');if(!v)return;n.name=v;await dbPut(n);await reload();render()}
async function delNode(n){const sub=n.type==='folder'?NODES.filter(x=>isDesc(x.id,n.id)&&x.id!==n.id).length:0;if(!await confirmBox('Excluir "'+n.name+'"?',sub?`Isto também exclui ${sub} item(ns) dentro dela. Não há como desfazer.`:'Não há como desfazer.','Excluir'))return;const ids=NODES.filter(x=>isDesc(x.id,n.id)).map(x=>x.id);for(const i of ids)await dbDel(i);{const c=byId('culto');if(c){c.items=c.items.filter(x=>!ids.includes(x));await dbPut(c)}}if(cur&&ids.includes(cur))cur=n.parentId;await reload();render()}
async function moveNode(n,pid){if(n.id===pid||n.parentId===pid)return;if(pid&&isDesc(pid,n.id)){toast('Não dá para mover uma pasta para dentro dela mesma');return}n.parentId=pid;await dbPut(n);await reload();render();toast('Movido')}
async function copyDeep(n,pid,suffix){const c=structuredClone(n);c.id=uid();c.parentId=pid;c.created=Date.now();if(suffix)c.name=n.name+suffix;await dbPut(c);if(n.type==='folder'){for(const k of kids(n.id))await copyDeep(k,c.id,'')}return c}
/* ===== voltar ao início ===== */
function flushView(){clearTimeout(saveT);if(S)dbPut(S.n);unwake();S=null}
function fsToggle(){const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)throw 0;const r=f.call(el);if(r&&r.catch)r.catch(()=>toast('Tela cheia não permitida aqui. Instale o app pelo menu do Chrome (Instalar app) para abrir sem barras.'))}}catch(e){toast('Tela cheia não permitida aqui. Instale o app pelo menu do Chrome (Instalar app) para abrir sem barras.')}}
const WIDE=()=>window.matchMedia('(min-width:761px)').matches;
function sideClose(){$('#side').classList.remove('open')}
function sideHide(){sideClose();if(WIDE())$('.app').classList.add('nosb')}
function sideToggle(){if(WIDE())$('.app').classList.toggle('nosb');else $('#side').classList.toggle('open')}
async function goHome(){if(viewing){stopPlay();flushView()}Q='';$('#q').value='';cur=ROOT;viewing=null;sideClose();await reload();render()}
$('#brand').onclick=goHome;
$('#main').addEventListener('click',()=>{sideClose()},true);
$('#bHideSide').onclick=sideHide;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#q').blur();sideClose()}});
/* ===== busca ===== */
let Q='';
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function whereIs(n){return path(n.parentId).map(x=>x.name).join(' / ')||'Início'}
function renderSearch(){const m=$('#main');const q=norm(Q);const res=NODES.filter(n=>(n.type==='score'||n.type==='folder')&&norm(n.name).includes(q)).sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1));
 m.innerHTML=`<div class="top"><button class="btn mb" id="bMenu">☰</button><div class="crumbs"><a>🔎 “${esc(Q)}”</a></div><span class="mono mute">${res.length} resultado(s)</span><button class="btn" id="sClr">✕ Limpar busca</button></div>`+
 (res.length?`<div class="pane">${res.map(n=>`<div class="card" style="flex-direction:row;align-items:center;gap:10px;padding:10px;margin-bottom:8px" data-id="${n.id}"><span style="font-size:22px">${n.type==='folder'?'📁':'🎼'}</span><div style="flex:1;min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.name)}</div><div class="cs" style="padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(whereIs(n))}</div></div>${n.type==='score'?`<button class="btn ${inCulto(n.id)?'on':''}" data-cul="${n.id}">🎷</button>`:''}</div>`).join('')}</div>`:`<div class="empty"><h2>Nada encontrado</h2><p>Tente outra parte do nome ou só o número.</p></div>`);
 const bm=$('#bMenu');if(bm)bm.onclick=()=>sideToggle();
 $('#sClr').onclick=()=>{Q='';$('#q').value='';render()};
 m.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('button'))return;const n=byId(c.dataset.id);if(n.type==='folder'){Q='';$('#q').value='';cur=n.id;openIds.add(n.id);render()}else openScore(n.id)});
 m.querySelectorAll('[data-cul]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await toggleCulto(b.dataset.cul)})}
$('#q').oninput=e=>{Q=e.target.value.trim();if(viewing){closeScore();return}render()};
/* ===== tela acesa ===== */
let WL=null,WAKE=true,WLmsg=false;

  g.onpointermove=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest&&el.closest('.card');if(over&&over!==card&&over.parentNode===wrap){if(over.compareDocumentPosition(card)&Node.DOCUMENT_POSITION_FOLLOWING)wrap.insertBefore(over,card.nextSibling);else wrap.insertBefore(over,card)}};

 acts.push(['Mover para…',async()=>{const p=await pickFolder('Mover "'+n.name+'" para…',n.type==='folder'?n.id:null,'Mover aqui');if(!p)return;return moveNode(n,p.id)}]);

/* ===== backup ===== */
const b2s=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const s2b=async s=>await (await fetch(s)).blob();
async function backup(){const dl=window.claude?await claude.use('downloads'):null;if(!dl&&window.claude)return toast('Download indisponível aqui');toast('Preparando backup…');
 const out=[];for(const n of NODES){const c={...n};if(c.pages)c.pages=await Promise.all(c.pages.map(b2s));if(c.pdf)c.pdf=await b2s(c.pdf);out.push(c)}
 const data=JSON.stringify({v:1,nodes:out});try{if(dl)await dl.save({filename:'jscore-backup.json',data});else{const bl=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='jscore-backup.json';document.body.appendChild(a);a.click();a.remove()}toast('Backup salvo')}catch(e){toast('Backup cancelado')}}
async function restore(file){try{const j=JSON.parse(await file.text());if(!j.nodes)throw 0;let n=0;for(const c of j.nodes){if(c.pages)c.pages=await Promise.all(c.pages.map(s2b));if(c.pdf)c.pdf=await s2b(c.pdf);await dbPut(c);n++}await reload();render();toast(n+' itens restaurados')}catch(e){toast('Arquivo de backup inválido')}}

/* ===== bibliotecas sob demanda ===== */
const _ld={};
function loadLib(u){return _ld[u]||(_ld[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete _ld[u];rej(new Error('Não consegui carregar uma biblioteca (sem internet?)'))};document.head.appendChild(s)}))}
async function needPdf(){if(!window.pdfjsLib)await loadLib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib}
let ABC=null;
async function needAbc(){if(!ABC){await loadLib('https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js');ABC=window.ABCJS||window.abcjs}return ABC}
/* ===== imagens ===== */
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>res({i,u});i.onerror=rej;i.src=u})}
function cvBlob(c,q){return new Promise(r=>c.toBlob(r,'image/jpeg',q||.88))}
async function procImage(blob,{max=2200,rot=0,enh=false}={}){const {i,u}=await loadImg(blob);let w=i.naturalWidth,h=i.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');const sw=rot%180?h:w,sh=rot%180?w:h;c.width=sw;c.height=sh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sw,sh);x.translate(sw/2,sh/2);x.rotate(rot*Math.PI/180);if(enh)x.filter='grayscale(1) contrast(1.55) brightness(1.08)';x.drawImage(i,-w/2,-h/2,w,h);URL.revokeObjectURL(u);return cvBlob(c)}

/* ===== importação ===== */
const baseName=f=>f.name.replace(/\.[^.]+$/,'');
async function importFiles(files,pid){let last=null;
 for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();const n={id:uid(),type:'score',parentId:pid,name:baseName(f),created:Date.now(),notes:'',ann:{}};
  try{
   if(f.type.startsWith('image/')){n.kind='image';n.pages=[await procImage(f)]}
   else if(ext==='pdf'){n.kind='pdf';n.pdf=f;const d=await (await needPdf()).getDocument({data:await f.arrayBuffer()}).promise;n.nPages=d.numPages}
   else if(['xml','musicxml'].includes(ext)){n.kind='musicxml';n.xml=await f.text()}
   else if(['mid','midi'].includes(ext)){n.kind='midi';n.midi=f}
   else if(['abc','txt'].includes(ext)){n.kind='abc';n.abc=await f.text()}
   else if(ext==='mxl'){toast('.mxl compactado não é suportado. Exporte como MusicXML (.xml) ou PDF.');continue}
   else{toast('Formato não suportado: '+f.name);continue}
   await dbPut(n);last=n}catch(e){console.error(e);toast('Falha ao importar '+f.name)}}
 await reload();render();if(last&&files.length===1)openScore(last.id);else if(last)toast(files.length+' arquivos importados')}

window.__afterBoot=async()=>{
 if(!/[?&]share=1/.test(location.search))return;

 try{
  const c=await caches.open("jscore-share"),keys=await c.keys(),files=[];
  for(const k of keys){const r=await c.match(k),b=await r.blob();let nm=decodeURIComponent(k.url.split("/").pop().replace(/^\d+-/,""));files.push(new File([b],nm,{type:b.type}))}
  if(!files.length)return;
  toast(files.length+" arquivo(s) recebido(s) do compartilhamento");
  const p=await pickFolder("Guardar "+files.length+" arquivo(s) em…",null,"Importar aqui");
  if(p)await importFiles(files,p.id);else toast("Importação cancelada");
  for(const k of keys)await c.delete(k);
 }catch(e){toast("Não consegui receber o arquivo compartilhado")}
